<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI - Pro Presentation</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { font-family: 'Urbanist', sans-serif; }
        body { 
            background-color: #050505; 
            margin: 0; 
            overflow: hidden;
            color: #ffffff;
        }

        .bg-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(163, 230, 53, 0.08) 0%, transparent 70%);
            z-index: -1;
            filter: blur(40px);
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 60px;
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(20,20,20,1) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            overflow: hidden;
        }

        .accent-text { color: #a3e635; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
        }

        .prompt-bubble {
            background: #1a1a1a;
            border-left: 4px solid #a3e635;
            padding: 30px;
            border-radius: 0 24px 24px 24px;
            font-size: 2rem;
            line-height: 1.2;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-button {
            background: rgba(163, 230, 53, 0.1);
            color: #a3e635;
            border: 1px solid rgba(163, 230, 53, 0.3);
            padding: 12px 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .nav-button:hover:not(:disabled) {
            background: rgba(163, 230, 53, 0.2);
            transform: translateY(-2px);
        }
        .nav-button:disabled { opacity: 0.2; cursor: not-allowed; }

        .image-frame {
            border: 1px solid rgba(163, 230, 53, 0.2);
            border-radius: 16px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            max-width: 90%;
            margin: 0 auto;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { text-align: left; color: #a3e635; padding: 15px; font-weight: 600; }
        td { background: rgba(255,255,255,0.02); padding: 15px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const slides = [
            { layout: "title", title: "Claude AI", subtitle: "Från Idé till Interaktiv Kod", desc: "Utvärdering och presentation av Claude som ett verktyg för programmering och lärande." },
            { layout: "grid", title: "Nytta & Syfte", items: [{ icon: "fa-code", title: "Kod & Webb", text: "Skapa komplexa script och appar på sekunder." }, { icon: "fa-rocket", title: "Prototyping", text: "Perfekt för att snabbt testa idéer och spelmekanik." }, { icon: "fa-graduation-cap", title: "Pedagogik", text: "Claude förklarar stegen istället för att bara ge svar." }, { icon: "fa-lightbulb", title: "Idéer", text: "Brainstorming för projekt och logiska problem." }] },
            { layout: "prompt", title: "Prompt 1", prompt: "Skapa en Python-kod som genererar ett slumpmässigt nummer mellan 1–3000." },
            { layout: "image", title: "Resultat: Slumpen", desc: "Koden kördes i Google Colab.", result: "Enkel och ren kod som fungerade direkt utan några justeringar.", image: "Bilder/slumpmässigt_tal.png" },
            { layout: "prompt", title: "Prompt 2", prompt: "skapa ett snake spel i python, tack" },
            { layout: "image", title: "Resultat: Snake", desc: "Logiken för spelet i Python/Pygame.", result: "Fullt fungerande spel med poängräkning och kollisionslogik skapat på nolltid.", image: "Bilder/snake_spel.png" },
            { layout: "prompt", title: "Prompt 3", prompt: "skapa en python kod för ett skjut spel" },
            { layout: "image", title: "Resultat: Skjutspel", desc: "Anpassning för webben via Replit.", result: "Claude skapade grunden. För att kunna köra grafiken på webben användes Replit som anpassade koden smidigt.", image: "Bilder/skjut_spel.png" },
            { 
                layout: "comparison", 
                title: "Analys: Claude vs ChatGPT", 
                text: "Jag körde samma prompt i ChatGPT för att se om den kunde göra det bättre.", 
                analysis: "Resultatet blev att koden från ChatGPT var mycket mer simpel. Designen i helhet var inte alls lika inbjudande som den jag fick av Claude.",
                image: "Bilder/chatgpt_resultat.png"
            },
            { layout: "proscons", title: "Slutlig Utvärdering", pros: ["Pedagogisk och tydlig", "Stark känsla för designval", "Snabb vid iterationer", "Bra på problemlösning"], cons: ["Kräver externa miljöer (Replit)", "Risk för 'copy-paste' lärande", "Begränsade gratistokens", "Kan ej köra grafisk kod själv"] },
            { layout: "outro", title: "Tack!", content: "Projektet finns tillgängligt på GitHub. Claude visade sig vara ett utmärkt verktyg för att accelerera utvecklingsprocessen." }
        ];

        function Presentation() {
            const [index, setIndex] = useState(0);
            const s = slides[index];

            const next = () => setIndex(i => Math.min(i + 1, slides.length - 1));
            const prev = () => setIndex(i => Math.max(i - 1, 0));

            return (
                <div className="min-h-screen flex items-center justify-center p-10 bg-[#050505]">
                    <div className="bg-blob" style={{top: '10%', left: '10%'}}></div>
                    <div className="bg-blob" style={{bottom: '10%', right: '10%', background: 'radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%)'}}></div>
                    
                    <div className="slide-container shadow-2xl">
                        <div className="flex justify-between items-center mb-10">
                            <div className="text-sm font-bold tracking-widest opacity-40 uppercase">AI Tool Analysis // VT26</div>
                            <div className="text-sm font-mono opacity-40">Slide {index + 1} / {slides.length}</div>
                        </div>

                        <div className="flex-grow flex flex-col">
                            {s.layout === "title" && (
                                <div className="flex-grow flex flex-col justify-center items-center text-center">
                                    <h1 className="text-9xl font-extrabold mb-4 tracking-tighter italic uppercase">{s.title}<span className="accent-text">.</span></h1>
                                    <h2 className="text-4xl font-light mb-8 opacity-80">{s.subtitle}</h2>
                                    <p className="max-w-xl text-xl opacity-60 leading-relaxed">{s.desc}</p>
                                </div>
                            )}

                            {s.layout === "prompt" && (
                                <div className="flex-grow flex flex-col justify-center">
                                    <div className="text-sm font-bold uppercase opacity-40 mb-6 tracking-[0.3em]">{s.title} // Input</div>
                                    <div className="prompt-bubble italic font-medium">"{s.prompt}"</div>
                                </div>
                            )}

                            {s.layout === "grid" && (
                                <div>
                                    <h2 className="text-5xl font-bold mb-12 italic uppercase tracking-tighter">{s.title}<span className="accent-text">.</span></h2>
                                    <div className="grid grid-cols-2 gap-6">{s.items.map((item, i) => (
                                        <div key={i} className="glass-card flex items-start gap-5">
                                            <div className="w-12 h-12 rounded-lg bg-lime-400/10 flex items-center justify-center flex-shrink-0"><i className={`fa-solid ${item.icon} accent-text text-xl`}></i></div>
                                            <div><h3 className="text-xl font-bold mb-2">{item.title}</h3><p className="opacity-60">{item.text}</p></div>
                                        </div>
                                    ))}</div>
                                </div>
                            )}

                            {s.layout === "image" && (
                                <div className="grid grid-cols-2 gap-12 h-full items-center">
                                    <div>
                                        <h2 className="text-5xl font-bold mb-8 italic uppercase tracking-tighter">{s.title}<span className="accent-text">.</span></h2>
                                        <div className="space-y-6">
                                            <div className="glass-card"><p className="opacity-60 mb-2 text-sm uppercase tracking-widest font-bold">Process</p><p className="text-lg">{s.desc}</p></div>
                                            <div className="glass-card border-lime-400/20"><p className="accent-text mb-2 text-sm uppercase tracking-widest font-bold">Utfall</p><p className="text-lg">{s.result}</p></div>
                                        </div>
                                    </div>
                                    <div className="flex justify-center">
                                        <div className="image-frame">
                                            <img src={s.image} alt="Exempel" className="rounded-lg w-full shadow-2xl" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {s.layout === "comparison" && (
                                <div className="grid grid-cols-2 gap-12 h-full items-center">
                                    <div>
                                        <h2 className="text-5xl font-bold mb-8 italic uppercase tracking-tighter">{s.title}<span className="accent-text">.</span></h2>
                                        <div className="glass-card border-l-4 border-l-lime-400 mb-6">
                                            <p className="opacity-80 text-lg leading-relaxed">{s.text}</p>
                                        </div>
                                        <div className="glass-card bg-red-400/5 border-l-4 border-l-red-400">
                                            <p className="accent-text mb-2 text-sm uppercase tracking-widest font-bold">Slutsats</p>
                                            <p className="text-xl font-semibold leading-relaxed">{s.analysis}</p>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-center justify-center">
                                        <p className="text-xs uppercase tracking-widest mb-4 opacity-40">Skärmklipp: ChatGPT Resultat</p>
                                        <div className="image-frame opacity-80 hover:opacity-100 transition-opacity">
                                            <img src={s.image} alt="ChatGPT" className="rounded-lg w-full shadow-2xl" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {s.layout === "proscons" && (
                                <div className="flex-grow flex flex-col justify-center">
                                    <h2 className="text-5xl font-bold mb-12 italic uppercase tracking-tighter">{s.title}<span className="accent-text">.</span></h2>
                                    <div className="grid grid-cols-2 gap-8">
                                        <div className="space-y-4">
                                            <div className="text-sm font-bold uppercase opacity-40 mb-4 tracking-widest">Fördelar</div>
                                            {s.pros.map((p, i) => <div key={i} className="flex items-center gap-3"><i className="fa-solid fa-plus text-xs accent-text"></i> {p}</div>)}
                                        </div>
                                        <div className="space-y-4">
                                            <div className="text-sm font-bold uppercase opacity-40 mb-4 tracking-widest">Nackdelar / Begränsningar</div>
                                            {s.cons.map((c, i) => <div key={i} className="flex items-center gap-3"><i className="fa-solid fa-minus text-xs text-red-500"></i> {c}</div>)}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {s.layout === "outro" && (
                                <div className="flex-grow flex flex-col justify-center items-center text-center">
                                    <h2 className="text-7xl font-bold mb-8 italic uppercase tracking-tighter">{s.title}<span className="accent-text">.</span></h2>
                                    <p className="max-w-2xl text-2xl font-light opacity-80 leading-relaxed">{s.content}</p>
                                </div>
                            )}
                        </div>

                        <div className="flex justify-between items-center mt-10">
                            <div className="flex gap-4">
                                <button onClick={prev} disabled={index === 0} className="nav-button"><i className="fa-solid fa-chevron-left"></i> Bakåt</button>
                                <button onClick={next} disabled={index === slides.length - 1} className="nav-button">Nästa <i className="fa-solid fa-chevron-right"></i></button>
                            </div>
                            <div className="opacity-20 text-xs tracking-[0.3em] font-bold uppercase">Claude AI Ecosystem // v.1.5</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Presentation />);
    </script>
</body>
</html>
